# Lints the Lua code and runs the addon against the small fake WoW API in tests/mock.lua on every push.
name: Tests

on:
  push:
  pull_request:

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: lunarmodules/luacheck@v1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: lua5.1 tests/mock.lua .
