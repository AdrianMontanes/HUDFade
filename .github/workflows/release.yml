# Builds the addon zip and uploads it to GitHub Releases, CurseForge, Wago and WoWInterface
# whenever a version tag (like 0.2.0) is pushed. A site whose token secret is missing is skipped.
name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write # lets the packager create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, for the changelog

      - uses: BigWigsMods/packager@v2
